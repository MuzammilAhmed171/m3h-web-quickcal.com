<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickCal - Appointment Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #3f51b5;
            --accent: #2196f3;
            --today: #4caf50;
            --delete: #f44336;
            --card-shadow: rgba(0,0,0,0.1);
            --bg-light: #fafafa;
            --text-light: #333;
            --bg-dark: #1e1e1e;
            --text-dark: #f0f0f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        body.dark-theme {
            background-color: var(--bg-dark);
            color: var(--text-dark);
        }

        /* Header Styles */
        header {
            background-color: var(--primary);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .logo i {
            font-size: 1.8rem;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .today-btn {
            background-color: white;
            color: var(--primary);
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }

        .today-btn:hover {
            background-color: #e0e0e0;
        }

        .theme-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .theme-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        /* Main Content */
        .main-container {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
        }

        /* Calendar Styles */
        .calendar-section {
            flex: 1;
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            padding: 20px;
            display: flex;
            flex-direction: column;
            max-width: 100%;
        }

        body.dark-theme .calendar-section {
            background-color: #2d2d2d;
        }

        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        .nav-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--primary);
            cursor: pointer;
            padding: 5px;
        }

        body.dark-theme .nav-btn {
            color: var(--accent);
        }

        .current-month {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        body.dark-theme .weekdays {
            border-bottom: 1px solid #444;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-gap: 8px;
            flex: 1;
        }

        .calendar-day {
            min-height: 100px;
            background-color: #f5f5f5;
            border-radius: 8px;
            padding: 8px;
            position: relative;
            cursor: pointer;
            border: 1px solid #eee;
        }

        body.dark-theme .calendar-day {
            background-color: #333;
            border-color: #444;
        }

        .calendar-day:hover {
            background-color: #e0e0e0;
        }

        body.dark-theme .calendar-day:hover {
            background-color: #444;
        }

        .day-number {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .today .day-number {
            color: var(--today);
            font-weight: bold;
        }

        .today {
            border: 2px solid var(--today) !important;
            background-color: rgba(76, 175, 80, 0.1) !important;
        }

        .appointment-dots {
            position: absolute;
            bottom: 8px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 4px;
        }

        .appointment-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .dot-meeting { background-color: #2196f3; }
        .dot-medical { background-color: #f44336; }
        .dot-personal { background-color: #ff9800; }
        .dot-other { background-color: #4caf50; }

        /* Appointment Panel */
        .appointment-panel {
            width: 350px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        body.dark-theme .appointment-panel {
            background-color: #2d2d2d;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
            margin-bottom: 15px;
        }

        body.dark-theme .panel-header {
            border-bottom: 1px solid #444;
        }

        .panel-title {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .close-panel {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #777;
        }

        body.dark-theme .close-panel {
            color: #aaa;
        }

        .appointment-list {
            flex: 1;
            overflow-y: auto;
            max-height: calc(100vh - 200px);
        }

        .appointment-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 6px var(--card-shadow);
            position: relative;
        }

        body.dark-theme .appointment-card {
            background-color: #333;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .card-title {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .appointment-time {
            color: #666;
            font-size: 0.9rem;
        }

        body.dark-theme .appointment-time {
            color: #aaa;
        }

        .appointment-type {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
            margin-top: 5px;
        }

        .type-meeting { background-color: #e3f2fd; color: #1976d2; }
        .type-medical { background-color: #ffebee; color: #d32f2f; }
        .type-personal { background-color: #fff3e0; color: #f57c00; }
        .type-other { background-color: #e8f5e9; color: #388e3c; }

        body.dark-theme .type-meeting { background-color: #0d47a1; }
        body.dark-theme .type-medical { background-color: #b71c1c; }
        body.dark-theme .type-personal { background-color: #e65100; }
        body.dark-theme .type-other { background-color: #1b5e20; }

        .card-actions {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        .edit-btn { color: var(--accent); }
        .delete-btn { color: var(--delete); }

        .no-appointments {
            text-align: center;
            padding: 20px;
            color: #777;
            font-style: italic;
        }

        body.dark-theme .no-appointments {
            color: #aaa;
        }

        /* FAB Button */
        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: var(--accent);
            color: white;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            animation: bounce 1s ease-in-out;
        }

        .fab:hover {
            background-color: #1976d2;
            transform: scale(1.05);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-20px);}
            60% {transform: translateY(-10px);}
        }

        /* Modal Styles */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background-color: white;
            border-radius: 10px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transform: translateY(-50px);
            transition: transform 0.3s ease-out;
            overflow: hidden;
        }

        .modal.active .modal-content {
            transform: translateY(0);
        }

        body.dark-theme .modal-content {
            background-color: #2d2d2d;
        }

        .modal-header {
            background-color: var(--primary);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .close-modal {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-body {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }

        body.dark-theme .form-control {
            background-color: #333;
            border-color: #444;
            color: white;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .modal-footer {
            padding: 15px 20px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            border-top: 1px solid #eee;
        }

        body.dark-theme .modal-footer {
            border-top: 1px solid #444;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            font-size: 1rem;
        }

        .btn-save {
            background-color: #4caf50;
            color: white;
        }

        .btn-save:hover {
            background-color: #388e3c;
        }

        .btn-cancel {
            background-color: #9e9e9e;
            color: white;
        }

        .btn-cancel:hover {
            background-color: #757575;
        }

        .btn-delete {
            background-color: var(--delete);
            color: white;
        }

        .btn-delete:hover {
            background-color: #d32f2f;
        }

        /* Footer */
        footer {
            background-color: #eeeeee;
            color: #555555;
            text-align: center;
            padding: 15px;
            font-size: 0.9rem;
        }

        body.dark-theme footer {
            background-color: #1a1a1a;
            color: #aaa;
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .main-container {
                flex-direction: column;
            }
            
            .appointment-panel {
                width: 100%;
                max-width: 100%;
            }
        }

        @media (max-width: 768px) {
            .calendar-day {
                min-height: 80px;
            }
            
            .day-number {
                font-size: 1rem;
            }
            
            .appointment-dot {
                width: 6px;
                height: 6px;
            }
            
            .header-controls {
                gap: 10px;
            }
            
            .logo {
                font-size: 1.2rem;
            }
            
            .today-btn {
                padding: 6px 12px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 576px) {
            .calendar-day {
                min-height: 60px;
                padding: 5px;
            }
            
            .day-number {
                top: 4px;
                right: 4px;
                font-size: 0.9rem;
            }
            
            .appointment-dots {
                bottom: 4px;
            }
            
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Header Section -->
    <header>
        <div class="logo">
            <i class="fas fa-calendar-alt"></i>
            <span>QuickCal</span>
        </div>
        <div class="header-controls">
            <button class="today-btn" id="todayBtn">
                <i class="fas fa-calendar-day"></i> Today
            </button>
            <label class="theme-switch">
                <input type="checkbox" id="themeToggle">
                <span class="slider"></span>
            </label>
        </div>
    </header>

    <!-- Main Content -->
    <div class="main-container">
        <!-- Calendar Section -->
        <section class="calendar-section">
            <div class="calendar-header">
                <button class="nav-btn" id="prevMonth">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <div class="current-month" id="currentMonth">June 2025</div>
                <button class="nav-btn" id="nextMonth">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
            
            <div class="weekdays">
                <div>Sun</div>
                <div>Mon</div>
                <div>Tue</div>
                <div>Wed</div>
                <div>Thu</div>
                <div>Fri</div>
                <div>Sat</div>
            </div>
            
            <div class="calendar-grid" id="calendarGrid">
                <!-- Calendar days will be generated by JavaScript -->
            </div>
        </section>

        <!-- Appointment Panel -->
        <section class="appointment-panel" id="appointmentPanel">
            <div class="panel-header">
                <div class="panel-title">Appointments for <span id="panelDate">June 21, 2025</span></div>
                <button class="close-panel" id="closePanel">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="appointment-list" id="appointmentList">
                <!-- Appointment cards will be generated by JavaScript -->
            </div>
        </section>
    </div>

    <!-- Floating Action Button -->
    <button class="fab" id="fabBtn">
        <i class="fas fa-plus"></i>
    </button>

    <!-- Add/Edit Appointment Modal -->
    <div class="modal" id="appointmentModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">Add Appointment</div>
                <button class="close-modal" id="closeModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="appointmentForm">
                    <input type="hidden" id="appointmentId">
                    <input type="hidden" id="appointmentDate">
                    
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" class="form-control" placeholder="Appointment title" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" class="form-control" placeholder="Appointment details" rows="3"></textarea>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="date">Date</label>
                            <input type="date" id="date" class="form-control" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="time">Time</label>
                            <input type="time" id="time" class="form-control" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="type">Type</label>
                        <select id="type" class="form-control" required>
                            <option value="">Select type</option>
                            <option value="meeting">Meeting</option>
                            <option value="medical">Medical</option>
                            <option value="personal">Personal</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-delete" id="deleteBtn" style="display:none;">Delete</button>
                <button type="button" class="btn btn-cancel" id="cancelBtn">Cancel</button>
                <button type="submit" class="btn btn-save" form="appointmentForm">Save</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Confirm Deletion</div>
                <button class="close-modal" id="closeDeleteModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this appointment?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-cancel" id="cancelDelete">Cancel</button>
                <button type="button" class="btn btn-delete" id="confirmDelete">Delete</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>© 2025 QuickCal. All Rights Reserved.</p>
    </footer>

    <script>
        // State management
        let currentDate = new Date(2025, 5, 21); // June 21, 2025
        let appointments = [];
        let selectedDate = new Date();
        let editingAppointment = null;

        // DOM Elements
        const calendarGrid = document.getElementById('calendarGrid');
        const currentMonthEl = document.getElementById('currentMonth');
        const prevMonthBtn = document.getElementById('prevMonth');
        const nextMonthBtn = document.getElementById('nextMonth');
        const todayBtn = document.getElementById('todayBtn');
        const fabBtn = document.getElementById('fabBtn');
        const appointmentPanel = document.getElementById('appointmentPanel');
        const panelDateEl = document.getElementById('panelDate');
        const closePanelBtn = document.getElementById('closePanel');
        const appointmentList = document.getElementById('appointmentList');
        const appointmentModal = document.getElementById('appointmentModal');
        const modalTitle = document.getElementById('modalTitle');
        const closeModalBtn = document.getElementById('closeModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const deleteBtn = document.getElementById('deleteBtn');
        const appointmentForm = document.getElementById('appointmentForm');
        const deleteModal = document.getElementById('deleteModal');
        const closeDeleteModalBtn = document.getElementById('closeDeleteModal');
        const cancelDeleteBtn = document.getElementById('cancelDelete');
        const confirmDeleteBtn = document.getElementById('confirmDelete');
        const themeToggle = document.getElementById('themeToggle');

        // Initialize the calendar
        function initCalendar() {
            renderCalendar();
            loadAppointments();
            setupEventListeners();
        }

        // Render the calendar
        function renderCalendar() {
            // Clear the calendar grid
            calendarGrid.innerHTML = '';
            
            // Set the current month and year
            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 
                              'July', 'August', 'September', 'October', 'November', 'December'];
            currentMonthEl.textContent = `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
            
            // Get the first day of the month and the number of days
            const firstDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
            const lastDay = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0);
            const daysInMonth = lastDay.getDate();
            
            // Calculate the starting day (0 = Sunday, 1 = Monday, etc.)
            let startDay = firstDay.getDay();
            
            // Calculate the number of days to show from the previous month
            const prevMonthLastDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 0).getDate();
            
            // Today's date for highlighting
            const today = new Date();
            
            // Create calendar days
            for (let i = 0; i < 42; i++) {
                const dayElement = document.createElement('div');
                dayElement.className = 'calendar-day';
                
                let dayNumber;
                let date = new Date(currentDate);
                
                if (i < startDay) {
                    // Previous month
                    dayNumber = prevMonthLastDay - startDay + i + 1;
                    date.setDate(dayNumber);
                    date.setMonth(date.getMonth() - 1);
                    dayElement.classList.add('prev-month');
                } else if (i >= startDay + daysInMonth) {
                    // Next month
                    dayNumber = i - startDay - daysInMonth + 1;
                    date.setDate(dayNumber);
                    date.setMonth(date.getMonth() + 1);
                    dayElement.classList.add('next-month');
                } else {
                    // Current month
                    dayNumber = i - startDay + 1;
                    date.setDate(dayNumber);
                    
                    // Highlight today
                    if (date.toDateString() === today.toDateString()) {
                        dayElement.classList.add('today');
                    }
                }
                
                // Set the day number
                const dayNumElement = document.createElement('div');
                dayNumElement.className = 'day-number';
                dayNumElement.textContent = dayNumber;
                dayElement.appendChild(dayNumElement);
                
                // Add appointment dots
                const dotsContainer = document.createElement('div');
                dotsContainer.className = 'appointment-dots';
                
                const dayAppointments = getAppointmentsForDate(date);
                const typeCount = {
                    meeting: 0,
                    medical: 0,
                    personal: 0,
                    other: 0
                };
                
                // Count appointments by type
                dayAppointments.forEach(appt => {
                    typeCount[appt.type] = (typeCount[appt.type] || 0) + 1;
                });
                
                // Create dots for each type with appointments
                Object.entries(typeCount).forEach(([type, count]) => {
                    if (count > 0) {
                        const dot = document.createElement('div');
                        dot.className = `appointment-dot dot-${type}`;
                        dotsContainer.appendChild(dot);
                    }
                });
                
                dayElement.appendChild(dotsContainer);
                
                // Add click event
                dayElement.addEventListener('click', () => {
                    selectedDate = date;
                    openAppointmentPanel();
                });
                
                calendarGrid.appendChild(dayElement);
            }
        }

        // Appointment functions
        function getAppointmentsForDate(date) {
            return appointments.filter(appt => {
                const apptDate = new Date(appt.date);
                return apptDate.toDateString() === date.toDateString();
            });
        }

        function openAppointmentPanel() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            panelDateEl.textContent = selectedDate.toLocaleDateString('en-US', options);
            
            // Clear existing appointments
            appointmentList.innerHTML = '';
            
            // Get appointments for the selected date
            const dayAppointments = getAppointmentsForDate(selectedDate);
            
            if (dayAppointments.length === 0) {
                const noAppointments = document.createElement('div');
                noAppointments.className = 'no-appointments';
                noAppointments.textContent = 'No appointments for this date';
                appointmentList.appendChild(noAppointments);
            } else {
                dayAppointments.forEach(appt => {
                    const card = createAppointmentCard(appt);
                    appointmentList.appendChild(card);
                });
            }
            
            // Show the panel
            appointmentPanel.style.display = 'flex';
        }

        function createAppointmentCard(appointment) {
            const card = document.createElement('div');
            card.className = 'appointment-card';
            card.dataset.id = appointment.id;
            
            // Format time
            const time = new Date(appointment.date);
            const timeString = time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            card.innerHTML = `
                <div class="card-header">
                    <div class="card-title">${appointment.title}</div>
                    <div class="appointment-time">${timeString}</div>
                </div>
                <div class="appointment-type type-${appointment.type}">
                    ${appointment.type.charAt(0).toUpperCase() + appointment.type.slice(1)}
                </div>
                <div class="card-actions">
                    <button class="action-btn edit-btn" data-id="${appointment.id}">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button class="action-btn delete-btn" data-id="${appointment.id}">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            `;
            
            return card;
        }

        function openAppointmentModal(date, appointment = null) {
            editingAppointment = appointment;
            
            if (appointment) {
                modalTitle.textContent = 'Edit Appointment';
                document.getElementById('appointmentId').value = appointment.id;
                document.getElementById('title').value = appointment.title;
                document.getElementById('description').value = appointment.description || '';
                document.getElementById('date').value = formatDateForInput(new Date(appointment.date));
                document.getElementById('time').value = formatTimeForInput(new Date(appointment.date));
                document.getElementById('type').value = appointment.type;
                deleteBtn.style.display = 'block';
            } else {
                modalTitle.textContent = 'Add Appointment';
                document.getElementById('appointmentForm').reset();
                document.getElementById('appointmentId').value = '';
                document.getElementById('date').value = formatDateForInput(date);
                document.getElementById('time').value = formatTimeForInput(new Date());
                deleteBtn.style.display = 'none';
            }
            
            appointmentModal.classList.add('active');
        }

        function saveAppointment(e) {
            e.preventDefault();
            
            const id = document.getElementById('appointmentId').value || Date.now().toString();
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;
            const type = document.getElementById('type').value;
            
            // Combine date and time
            const dateTime = new Date(`${date}T${time}`);
            
            const appointment = {
                id,
                title,
                description,
                date: dateTime.toISOString(),
                type
            };
            
            if (editingAppointment) {
                // Update existing appointment
                const index = appointments.findIndex(a => a.id === editingAppointment.id);
                if (index !== -1) {
                    appointments[index] = appointment;
                }
            } else {
                // Add new appointment
                appointments.push(appointment);
            }
            
            saveAppointments();
            renderCalendar();
            closeAppointmentModal();
            openAppointmentPanel();
        }

        function deleteAppointment() {
            if (editingAppointment) {
                appointments = appointments.filter(a => a.id !== editingAppointment.id);
                saveAppointments();
                renderCalendar();
                closeAppointmentModal();
                openAppointmentPanel();
            }
            deleteModal.classList.remove('active');
        }

        // Utility functions
        function formatDateForInput(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function formatTimeForInput(date) {
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${hours}:${minutes}`;
        }

        function saveAppointments() {
            localStorage.setItem('quickcal_appointments', JSON.stringify(appointments));
        }

        function loadAppointments() {
            const saved = localStorage.getItem('quickcal_appointments');
            if (saved) {
                appointments = JSON.parse(saved);
            }
        }

        function closeAppointmentModal() {
            appointmentModal.classList.remove('active');
            editingAppointment = null;
        }

        function closeDeleteModal() {
            deleteModal.classList.remove('active');
        }

        // Event listeners
        function setupEventListeners() {
            // Navigation
            prevMonthBtn.addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() - 1);
                renderCalendar();
            });
            
            nextMonthBtn.addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() + 1);
                renderCalendar();
            });
            
            todayBtn.addEventListener('click', () => {
                currentDate = new Date();
                renderCalendar();
            });
            
            // FAB button
            fabBtn.addEventListener('click', () => {
                openAppointmentModal(selectedDate);
            });
            
            // Close panel
            closePanelBtn.addEventListener('click', () => {
                appointmentPanel.style.display = 'none';
            });
            
            // Modal controls
            closeModalBtn.addEventListener('click', closeAppointmentModal);
            cancelBtn.addEventListener('click', closeAppointmentModal);
            
            // Appointment form
            appointmentForm.addEventListener('submit', saveAppointment);
            
            // Delete button
            deleteBtn.addEventListener('click', () => {
                deleteModal.classList.add('active');
            });
            
            // Delete modal controls
            closeDeleteModalBtn.addEventListener('click', closeDeleteModal);
            cancelDeleteBtn.addEventListener('click', closeDeleteModal);
            confirmDeleteBtn.addEventListener('click', deleteAppointment);
            
            // Edit and delete appointment events (delegated)
            appointmentList.addEventListener('click', (e) => {
                const editBtn = e.target.closest('.edit-btn');
                const deleteBtn = e.target.closest('.delete-btn');
                
                if (editBtn) {
                    const id = editBtn.dataset.id;
                    const appointment = appointments.find(a => a.id === id);
                    if (appointment) {
                        openAppointmentModal(new Date(appointment.date), appointment);
                    }
                }
                
                if (deleteBtn) {
                    const id = deleteBtn.dataset.id;
                    const appointment = appointments.find(a => a.id === id);
                    if (appointment) {
                        editingAppointment = appointment;
                        deleteModal.classList.add('active');
                    }
                }
            });
            
            // Theme toggle
            themeToggle.addEventListener('change', () => {
                document.body.classList.toggle('dark-theme', themeToggle.checked);
                localStorage.setItem('quickcal_theme', themeToggle.checked ? 'dark' : 'light');
            });
            
            // Load saved theme
            const savedTheme = localStorage.getItem('quickcal_theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-theme');
                themeToggle.checked = true;
            }
        }

        // Initialize the calendar when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            initCalendar();
            selectedDate = currentDate;
        });
    </script>
</body>
</html>
